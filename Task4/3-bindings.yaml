# ============================================
# ПРИВЯЗКА ПОЛЬЗОВАТЕЛЕЙ К РОЛЯМ
# ============================================

# 1. devops-user -> cluster-admin (на весь кластер)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: devops-admin
subjects:
- kind: ServiceAccount
  name: devops-user
  namespace: default
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io

# 2. security-user -> auditor (на весь кластер)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: security-auditor
subjects:
- kind: ServiceAccount
  name: security-user
  namespace: default
roleRef:
  kind: ClusterRole
  name: auditor
  apiGroup: rbac.authorization.k8s.io

# 3. analyst-user -> viewer (на весь кластер)
---
apiVersion: rbac.authorization.k8s.io/v1
